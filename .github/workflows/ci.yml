name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ai-service/requirements.txt
      - run: cd ai-service && python -m pytest tests/ -q

  data-pipeline-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check data-pipeline/src ai-service/app
      - name: Model quality gate (PRED-6)
        run: |
          if [ -f data-pipeline/outputs/model_comparison.json ]; then
            python data-pipeline/src/quality_gate.py
          else
            echo 'no model_comparison.json committed — gate skipped'
          fi


  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd backend && npm install && npm run build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd frontend && npm install && npm run build
