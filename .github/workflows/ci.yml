name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ai-service/requirements.txt
      # REQUIRE_MODEL=1: the committed registry model MUST load — without this the
      # suite silently degrades to asserting 503s and stays green while testing nothing.
      - run: cd ai-service && REQUIRE_MODEL=1 python -m pytest tests/ -q

  # PRED-14 (KAN-93): leakage controls — whitelist = schema, named blacklist, as-of rule.
  # The committed artifacts are checked by ai-service/tests/test_leakage_guard.py above.
  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r data-pipeline/requirements.txt pytest
      - run: python -m pytest data-pipeline/tests -q

  # NFR-SEC-2 (KAN-63): no secrets in the repository. Scans the FULL history, not only
  # the diff — a secret removed in a later commit is still leaked. Pinned binary with a
  # checksum (no third-party action, no licence key needed); --redact keeps any finding
  # out of the public CI log.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: |
          V=8.21.2
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --redact --no-banner -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # ruff pinned: CI must lint with the exact version the code was verified against,
      # or a new release's new rules turn the build red without any code change.
      - run: pip install ruff==0.15.11
      - run: ruff --version && ruff check data-pipeline/src ai-service/app
      # NFR-MAIN-1 (KAN-72): JS/TS leg — frontend + backend, pinned toolchain in the root package.json.
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci && npx eslint --version && npm run lint

  # Own job (not a step after lint): style noise must never mask a model-quality failure.
  model-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Model quality gate (PRED-6)
        run: |
          if [ -f data-pipeline/outputs/model_comparison.json ]; then
            python data-pipeline/src/quality_gate.py
          else
            echo 'no model_comparison.json committed — gate skipped'
          fi
      - name: Gate ↔ registry consistency
        run: |
          python - <<'EOF'
          import json, pathlib
          reg = pathlib.Path('ai-service/model/registry')
          versions = sorted((p for p in reg.glob('v*') if p.name[1:].isdigit()),
                            key=lambda p: int(p.name[1:]))
          if not versions:
              print('no registry — skipped'); raise SystemExit(0)
          meta = json.loads((versions[-1] / 'meta.json').read_text())
          comp = json.loads(pathlib.Path('data-pipeline/outputs/model_comparison.json').read_text())
          assert meta['champion_classifier'] == comp['champion']['classifier'], \
              f"registry {versions[-1].name} champion != committed comparison — stale artifact or metrics"
          print(f"OK: {versions[-1].name} serves {meta['champion_classifier']}, matches model_comparison.json")
          EOF

  # No scaffold guards any more: both components exist, so a missing package.json
  # must turn CI red instead of being skipped green. npm ci = the committed lockfile.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Build and test backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test
