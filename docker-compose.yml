services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: construction
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    # NFR-SEC-5: not published to the host — reachable only from the backend on the
    # compose network. For local debugging uncomment:
    # ports: ["8001:8001"]
    environment:
      FEATURE_SCHEMA: /srv/feature_schema.json          # PRED-8: running schema
      # PRED-12: empty = use the bands shipped with the served model (registry meta.json, v6+);
      # set a value only to override for a demo
      RISK_BAND_T1: ${RISK_BAND_T1:-}
      RISK_BAND_T2: ${RISK_BAND_T2:-}
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env - copy .env.example}   # NFR-SEC-5
    volumes:
      - ./feature_schema.json:/srv/feature_schema.json:ro
    healthcheck:                                        # PRED-2: readiness, not liveness
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:8001/health')); sys.exit(0 if d.get('model_loaded') else 1)"]
      interval: 10s
      retries: 12

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASS: app
      DB_NAME: construction
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env - copy .env.example}   # NFR-SEC-5
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - copy .env.example}   # NFR-SEC-1/2: no default
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      ai-service: { condition: service_healthy }   # PRED-2: wait on readiness

volumes:
  pgdata:
