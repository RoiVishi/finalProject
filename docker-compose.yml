services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: construction
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    # NFR-SEC-5: not published to the host — reachable only from the backend on the
    # compose network. For local debugging uncomment:
    # ports: ["8001:8001"]
    environment:
      FEATURE_SCHEMA: /srv/feature_schema.json          # PRED-8: running schema
      RISK_BAND_T1: ${RISK_BAND_T1:-0.33}               # PRED-12: bands via config
      RISK_BAND_T2: ${RISK_BAND_T2:-0.66}
    volumes:
      - ./feature_schema.json:/srv/feature_schema.json:ro
    healthcheck:                                        # PRED-2: readiness, not liveness
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:8001/health')); sys.exit(0 if d.get('model_loaded') else 1)"]
      interval: 10s
      retries: 12

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASS: app
      DB_NAME: construction
      AI_SERVICE_URL: http://ai-service:8001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      ai-service: { condition: service_healthy }   # PRED-2: wait on readiness

volumes:
  pgdata:
